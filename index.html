.card{background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(10px)}

.mode{animation:rise .5s both}.mode:nth-child(2){animation-delay:.08s}.mode:nth-child(3){animation-delay:.16s}.mode:nth-child(4){animation-delay:.24s}

cn.on('data',m=>{if(!m||m.t!=='op'||typeof m.path!=='string'||m.path.indexOf('rooms/'+code)!==0)return;const q=parse(m.path);if(q.k==='r'&&m.op!=='update')return;if(q.k==='p'&&m.op==='set')cn.uid=q.u;apply(m);bc(m)});
cn.on('close',()=>{conns=conns.filter(x=>x!==cn);if(cn.uid&&st.players[cn.uid]){const o={t:'op',op:'delete',path:'rooms/'+code+'/players/'+cn.uid};apply(o);bc(o)}})})}
async function probe(c){if(hc&&!joined){const h=hc;hc=null;code='';try{h.close()}catch(e){}}
try{if(!cp||cp.destroyed)cp=await mk()}catch(e){return{...ex(null),err:'net'}}
return new Promise(res=>{let done=0;const cn=cp.connect('dla-'+c,{reliable:true,serialization:'json'});
const fin=v=>{if(done)return;done=1;clearTimeout(tm);cp.off('error',eh);res(v)};
const tm=setTimeout(()=>{try{cn.close()}catch(e){}fin({...ex(null),err:'timeout'})},22000);
const eh=e=>{if(e&&e.type==='peer-unavailable')fin(ex(null));else if(e)fin({...ex(null),err:'net'})};cp.on('error',eh);cn.on('error',()=>fin({...ex(null),err:'timeout'}));
cn.on('data',m=>{if(!m)return;if(m.t==='snap'&&!done){hc=cn;code=c;st.room=m.room;st.players=m.players||{};fin(ex(st.room))}else if(hc===cn&&m.t==='op'){apply(m);if(m.op==='delete'&&parse(m.path).k==='r')setTimeout(clean,200)}});
cn.on('close',()=>{if(hc===cn){const j=joined;hc=null;if(j){apply({op:'delete',path:'rooms/'+code});clean()}else code=''}})})}
function send(o){o.t='op';const q=parse(o.path);
if(host){apply(o);bc(o);if(q.k==='r'&&o.op==='delete')setTimeout(clean,600)}
else if(hc&&hc.open){joined=true;hc.send(o);if(q.k==='p'&&o.op==='delete'&&q.u===me0)setTimeout(clean,300)}
else return Promise.reject(new Error('Mất kết nối'));return Promise.resolve()}
const sub=(path,col,cb)=>{const s={path,col,cb};subs.push(s);setTimeout(()=>emit(s),0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}};
return{doc:path=>({
get:async()=>{const q=parse(path);if(host||(joined&&code===q.c))return ex(q.k==='r'?st.room:st.players[q.u]);if(q.k!=='r')return ex(null);return probe(q.c)},
set:async d=>{const q=parse(path);if(!host&&!hc&&q.k==='r')await become(q.c);return send({op:'set',path,data:d})},
update:async d=>send({op:'update',path,data:d}),
delete:async()=>send({op:'delete',path}),
onSnapshot:cb=>sub(path,0,cb)}),
collection:path=>({onSnapshot:cb=>sub(path,1,cb)})}};

(async()=>{let er='';try{if(!window.Peer)throw new Error('Không tải được thư viện kết nối (PeerJS). Kiểm tra mạng rồi tải lại trang.');let id='';try{id=sessionStorage.getItem('duid')||''}catch(e){}if(!id){id=Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{sessionStorage.setItem('duid',id)}catch(e){}}db=NET(id);uid=id}catch(e){er=String(e.message||e)}
if(!db||!uid){E('app').innerHTML='<div class="wrap c"><h1>Địa Lý Arena</h1><p class="mu">'+(er||'Không kết nối được máy chủ trực tuyến.')+'</p></div>';return}
off=[...uid].reduce((a,c)=>a+c.charCodeAt(0),0);render();setInterval(tick,250)})();

function homeH(){const o=(a,v)=>a.map(x=>`<option value="${x[0]}" ${x[0]==v?'selected':''}>${x[1]}</option>`).join('');
return `<div class="wrap"><h1>Địa Lý Arena</h1><p class="sub">Đấu trí trực tuyến thời gian thực · Bài 17: Vỏ địa lí, quy luật thống nhất và hoàn chỉnh</p>
<div class="card"><input id="nm" maxlength="14" placeholder="Tên của bạn" value="${esc(nm)}" oninput="nm=this.value;try{localStorage.setItem('nm',nm)}catch(e){}">
${pickH()}</div>
<div class="card"><h3 style="margin-top:0">Vào phòng bằng mã</h3><div class="row"><input id="cd" inputmode="numeric" maxlength="5" placeholder="Mã phòng 5 số" value="${esc((new URLSearchParams(location.search).get('room')||'').replace(/\D/g,'').slice(0,5))}"><button class="btn" onclick="joinRoom()">Vào</button></div></div>
<h3>Hoặc tạo phòng mới và chọn chế độ</h3>
<div class="row2"><label>Số câu (Cổ điển, Sinh tồn)<select onchange="cfg.n=+this.value">${o([[8,'8 câu'],[12,'12 câu'],[18,'18 câu'],[24,'24 câu']],cfg.n)}</select></label>
<label>Thời gian (Đua vàng, Đua xe)<select onchange="cfg.d=+this.value">${o([[120,'2 phút'],[180,'3 phút'],[300,'5 phút']],cfg.d)}</select></label></div><br>
<div class="modes">${Object.entries(MD).map(([k,m])=>`<button class="mode" onclick="create('${k}')"><b>${m.e} ${m.n}</b><span>${m.d}</span></button>`).join('')}</div>
<p class="mu" style="font-size:.85rem">Hệ thống kỹ năng theo chuỗi đúng: chuỗi 3 nhận Khiên (chặn 1 lần sai), chuỗi 5 nhận Nhân đôi (câu kế tiếp), chuỗi 7 nhận Tấn công (trừ điểm người dẫn đầu). Mỗi ván có sẵn 1 lượt 50/50.</p></div>`}

var bsy=0;
async function create(mode){if(bsy)return;bsy=1;toast('Đang tạo phòng…');
try{let c;for(let n=0;;n++){c=String(1e4+Math.floor(Math.random()*9e4));const s=await db.doc('rooms/'+c).get();
if(s.err)throw new Error(s.err==='net'?'không kết nối được máy chủ trung gian, kiểm tra mạng':'kết nối quá chậm, thử lại');if(!s.exists)break;if(n>8)throw new Error('thử lại sau')}
await db.doc('rooms/'+c).set({host:uid,mode,st:'lobby',qs:sh(Q.map((_,i)=>i)),n:Math.min(cfg.n,Q.length),dur:cfg.d,tl:20,qi:0,ph:'q',ps:0,end:0,gid:0});enter(c)}
catch(e){toast('Không tạo được phòng: '+String(e&&(e.message||e.type)||e))}finally{bsy=0}}
async function joinRoom(){const c=E('cd').value.trim();if(!/^\d{5}$/.test(c))return toast('Mã phòng gồm 5 chữ số');if(bsy)return;bsy=1;toast('Đang tìm phòng '+c+'…');
try{const s=await db.doc('rooms/'+c).get();if(!s.exists)return toast(s.err==='net'?'Không kết nối được máy chủ trung gian. Kiểm tra mạng rồi thử lại':s.err==='timeout'?'Kết nối quá lâu. Thử lại hoặc đổi mạng (Wi-Fi/4G)':'Không tìm thấy phòng '+c);enter(c)}
catch(e){toast('Không vào được phòng: '+String(e&&e.message||e))}finally{bsy=0}}
async function enter(c){code=c;un.forEach(f=>f());un=[];room=null;P=[];rst=0;pg=0;fb=null;oc={};
await pme().set(blank());
un.push(pref().onSnapshot(s=>{if(!s.exists){if(code){toast('Phòng đã đóng');leave(1)}return}room=s.data();chk();render()}));
un.push(pcol().onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));chk();if(!room)return;if(room.st==='play'){const m=me();if(m&&m.gid!==pg){pg=m.gid;render()}else renderSide()}else render()}))}
function leave(local){un.forEach(f=>f());un=[];if(!local&&code){if(host())pref().delete().catch(()=>{});else pme().delete().catch(()=>{})}code='';room=null;P=[];render()}

function chk(){const m=me();if(m&&room&&room.st==='lobby')dd(m);if(!m||!room||room.st!=='play')return;
if(m.gid!==room.gid){if(rst===room.gid)return;rst=room.gid;fb=null;up({gid:room.gid,score:0,streak:0,lives:3,gold:0,pos:0,qi:0,aq:-1,ok:0,tot:0,ll:1,last:0,sh:0,dbl:0,arm:0,atk:0});return}
if(MD[room.mode].s&&room.ph==='r'&&m.aq!==room.qi&&m.lives>0&&Date.now()>room.ps)up({aq:room.qi,tot:m.tot+1,last:0,arm:0,...(m.sh>0?{sh:m.sh-1}:{streak:0,lives:room.mode==='surv'?m.lives-1:m.lives})})}
function earn(m,st){const p={};let t='';if(st===3){p.sh=(m.sh||0)+1;t='Khiên'}else if(st===5){p.dbl=(m.dbl||0)+1;t='Nhân đôi'}else if(st===7||(st>7&&st%3===1)){p.atk=(m.atk||0)+1;t='Tấn công'}if(t)skillFx(t==='Khiên'?'shield':t==='Nhân đôi'?'x2':'atk','Mở khóa · chuỗi '+st);return p}
function armX2(){const m=me();if(!m||m.dbl<1||m.arm)return;up({dbl:m.dbl-1,arm:1});skillFx('x2','Câu kế tiếp nhân đôi');render()}
function atk(){const m=me();if(!m||m.atk<1)return;const md=room.mode,v=rk().find(p=>p.id!==uid&&(md==='race'?p.pos>0:md==='gold'?p.gold>0:p.score>0));if(!v)return toast('Chưa có mục tiêu phù hợp');
const d=db.doc('rooms/'+code+'/players/'+v.id);let t;
if(md==='gold'){const g=Math.max(1,Math.round(v.gold*.2));d.update({gold:v.gold-g}).catch(()=>{});up({atk:m.atk-1,gold:m.gold+g});t=g+' vàng'}
else if(md==='race'){d.update({pos:Math.max(0,v.pos-2)}).catch(()=>{});up({atk:m.atk-1});t='2 bước'}
else{d.update({score:Math.max(0,v.score-250)}).catch(()=>{});up({atk:m.atk-1});t='250 điểm'}
toast('Tấn công '+v.name+': -'+t);T3.ev('atk');skillFx('atk',v.name+' · -'+t);render()}

function startGame(){busy='';const t=Date.now()+3000;pref().update({st:'play',gid:Date.now(),qi:0,ph:'q',ps:t,end:t+room.dur*1000})}
function rematch(){busy='';pref().update({st:'lobby',qs:sh(Q.map((_,i)=>i))})}
function endGame(){const k='e'+room.gid;if(busy===k)return;busy=k;pref().update({st:'end'})}
function go(ph){const k=room.gid+':'+room.qi+':'+ph;if(busy===k)return;busy=k;pref().update({ph,ps:Date.now()})}
function next(){const k=room.gid+':'+room.qi+':n';if(busy===k)return;busy=k;const al=G().filter(p=>p.lives>0).length;
if(room.qi+1>=room.n||(room.mode==='surv'&&G().length>1&&al<=1))return endGame();pref().update({qi:room.qi+1,ph:'q',ps:Date.now()})}

function tick(){if(!room||room.st!=='play')return;const now=Date.now(),t=E('tm'),b=E('bar'),el=now-room.ps;
if(now<room.ps){if(t)t.textContent=Math.ceil(-el/1e3);return}
if(intro){intro=0;render();return}
if(MD[room.mode].s){if(room.ph==='q'){const left=Math.max(0,room.tl-el/1e3);if(t){t.textContent=Math.ceil(left);t.classList.toggle('warn',left<=5)}if(b)b.style.width=left/room.tl*100+'%';
if(host()&&(el>=room.tl*1e3||(G().length&&!G().some(p=>p.lives>0&&p.aq!==room.qi))))go('r')}
else{if(t)t.textContent='✓';if(host()&&el>=4500)next()}}
else{const left=Math.max(0,(room.end-now)/1e3);if(t)t.textContent=Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0');if(b)b.style.width=left/room.dur/10+'%';
if(host()&&(left<=0||G().some(p=>p.pos>=TG)))endGame()}}

function pk(oi){const m=me();if(!m||room.ph!=='q'||Date.now()<room.ps||m.aq===room.qi||m.lives<=0)return;
const q=Q[room.qs[room.qi]],ok=oi===q[2],r=Math.min(1,Math.max(0,1-(Date.now()-room.ps)/(room.tl*1e3))),sv=room.mode==='surv';
let pt={aq:room.qi,tot:m.tot+1,ok:m.ok+(ok?1:0),arm:0},pts=0,note='';
if(ok){const st=m.streak+1;pts=sv?100+Math.round(100*r):500+Math.round(500*r)+Math.min(st,6)*40;if(m.arm){pts*=2;note='Nhân đôi'}Object.assign(pt,{streak:st},earn(m,st))}
else if(m.sh>0){pt.sh=m.sh-1;note='Khiên bảo vệ chuỗi';skillFx('shield','Chặn đòn · giữ chuỗi')}
else{pt.streak=0;if(sv)pt.lives=m.lives-1}
pt.score=m.score+pts;pt.last=pts;fb={k:room.qi,oi,ok,pts,note};up(pt);bp(ok?660:200);T3.ev(ok?'ok':note?'skill':'bad');render()}

function pk2(oi){const m=me();if(!m||fb||Date.now()<room.ps||Date.now()>room.end)return;const qid=cq(m),ok=oi===Q[qid][2],st=ok?m.streak+1:0,mul=m.arm?2:1;
let pt={qi:m.qi+1,tot:m.tot+1,ok:m.ok+(ok?1:0),arm:0},msg=ok?'':'Sai rồi';
if(!ok&&m.sh>0){pt.sh=m.sh-1;msg='Khiên bảo vệ chuỗi';skillFx('shield','Chặn đòn · giữ chuỗi')}else pt.streak=st;
if(ok)Object.assign(pt,earn(m,st));
if(room.mode==='race'){if(ok){const s=(st%3===0?2:1)*mul;pt.pos=m.pos+s;pt.score=m.score+10;msg=(st%3===0?'Turbo · ':'')+'+'+s+' bước'}}
else if(ok){const r=Math.random();let g=10+Math.floor(Math.random()*21)+Math.min(st,6)*3;msg='Rương · +'+g;
if(r>.9){g=60;msg='Kho báu · +60'}
else if(r>.7){const v=sh(G().filter(p=>p.id!==uid&&p.gold>0))[0];if(v){g=Math.min(v.gold,Math.max(10,Math.round(v.gold*.25)));v.gold-=g;db.doc('rooms/'+code+'/players/'+v.id).update({gold:v.gold}).catch(()=>{});msg='Cướp '+g+' vàng của '+v.name}}
pt.gold=m.gold+g*mul;if(mul>1)msg+=' (x2)'}
fb={k:'p'+m.qi,qid,key:'p'+m.qi+room.gid,oi,ok,msg};up(pt);bp(ok?660:200);T3.ev(ok?(room.mode==='gold'?'gold':'ok'):msg==='Khiên bảo vệ chuỗi'?'skill':'bad');render();setTimeout(()=>{fb=null;render()},ok?1000:1500)}

function ll(){const m=me();if(!m||m.ll<1||(fb&&!MD[room.mode].s))return;const s=MD[room.mode].s,qid=s?room.qs[room.qi]:cq(m),k=s?'s'+room.gid+room.qi:'p'+m.qi+room.gid;
hid={k,l:sh([0,1,2,3].filter(i=>i!==Q[qid][2])).slice(0,2)};up({ll:0});skillFx('half','Loại 2 đáp án sai');render()}

function qCard(qid,k,pick,rev,sel){const q=Q[qid],hd=hid.k===k?hid.l:[];
return `<h2 class="q">${esc(q[0])}</h2><div class="opts">${ord(k).map((oi,i)=>{let c='o c'+i;if(hd.includes(oi))c+=' off';
if(rev)c+=oi===q[2]?' ok':oi===sel?' bad':' dim';else if(oi===sel)c+=' sel';
return `<button class="${c}" ${rev||sel>=0?'disabled':''} onclick="${pick}(${oi})">${'ABCD'[i]} ${esc(q[1][oi])}</button>`}).join('')}</div>`}

function hudH(m){const md=room.mode,st=m.streak,nx=st<3?3:st<5?5:st<7?7:7+3*(Math.floor((st-7)/3)+1);
const v=md==='gold'?[m.gold,'Vàng']:md==='race'?[m.pos+'/'+TG,'Vị trí']:[m.score,'Điểm'];
return `<div class="hud2"><div class="kv"><small>${v[1]}</small><b>${v[0]}</b></div>${md==='surv'?`<div class="kv"><small>Mạng</small><b>${'♥'.repeat(Math.max(0,m.lives))||'—'}</b></div>`:''}<div class="kv ${st>=3?'hot':''}"><small>Chuỗi</small><b>${st}</b></div></div>
<div class="stk"><i style="width:${Math.min(100,st/nx*100)}%"></i></div><div class="mu sm">Mốc kế tiếp: chuỗi ${nx} (mở khóa kỹ năng)${m.arm?' · Nhân đôi đang bật':''}</div>
<div class="sks"><button class="sk" ${m.ll>0&&m.lives>0?'':'disabled'} onclick="ll()">50/50<em>${m.ll}</em></button><button class="sk" disabled title="Tự động chặn 1 lần sai">Khiên<em>${m.sh||0}</em></button><button class="sk" ${m.dbl>0&&!m.arm?'':'disabled'} onclick="armX2()">Nhân đôi<em>${m.dbl||0}</em></button><button class="sk" ${m.atk>0?'':'disabled'} onclick="atk()">Tấn công<em>${m.atk||0}</em></button></div>`}

function playH(){const m=me(),md=MD[room.mode],now=Date.now();let body='',sy=md.s;
const wait=t=>`<div class="msg">${t}</div>`;
if(!m||m.gid!==room.gid)body=wait('Đang chuẩn bị…');
else if(now<room.ps){intro=1;body=`<div class="msg"><div class="big">${md.e}</div>${md.n}<br><br>Sẵn sàng sau <span id="tm">3</span>…</div>`}
else if(sy){const qid=room.qs[room.qi],k='s'+room.gid+room.qi,mine=fb&&fb.k===room.qi;
if(room.ph==='q'){if(m.lives<=0)body=wait('Bạn đã bị loại. Hãy theo dõi các đối thủ còn lại.');
else if(m.aq===room.qi&&!mine)body=wait('Đã trả lời, chờ mọi người…');
else body=hudH(m)+qCard(qid,k,'pk',0,mine?fb.oi:-1)+(mine?'<div class="msg">Đã gửi! Chờ mọi người…</div>':'')}
else body=hudH(m)+qCard(qid,k,'pk',1,mine?fb.oi:-1)+`<div class="msg">${mine?(fb.ok?'Chính xác · +'+fb.pts:'Chưa chính xác')+(fb.note?' · '+fb.note:''):'Hết giờ'}</div>`}
else{if(fb)body=hudH(m)+qCard(fb.qid,fb.key,'pk2',1,fb.oi)+`<div class="msg">${esc(fb.msg)}</div>`;
else body=hudH(m)+qCard(cq(m),'p'+m.qi+room.gid,'pk2',0,-1)}
const prog=sy?`Câu ${room.qi+1}/${room.n}`:'Tự do';
return `<div class="stage"></div><div class="top"><b>${md.e} ${md.n} · ${prog}</b><span class="tm" id="tm">…</span></div><div class="bar"><i id="bar"></i></div>
<div class="game"><div class="card ${fb&&!fb.ok?'shake':''}" id="main">${body}</div><div class="card" id="side">${sideH()}</div></div>`}

function sideH(){const L=rk();let h='';
if(MD[room.mode].s&&room.ph==='q'&&room.st==='play')h=`<div class="mu">Đã trả lời ${L.filter(p=>p.aq===room.qi).length}/${L.length}</div>`;
if(room.mode==='race')return h+'<h4>Đường đua</h4>'+L.slice(0,10).map(p=>`<div class="lane"><span class="nm">${esc(p.name)}</span><div class="trk"><i style="left:${Math.min(100,p.pos/TG*100)}%">${AVI(p.av)}</i></div></div>`).join('');
return h+'<h4>Xếp hạng</h4>'+L.slice(0,8).map((p,i)=>`<div class="lb ${p.id===uid?'me':''}"><b>${i+1}</b>${AVI(p.av)}<span class="nm">${esc(p.name)}</span><em>${mv(p)}</em></div>`).join('')}
function sync3(){if(!room){T3.set('globe');T3.orbit(0);return}const k=room.st==='lobby'?'globe':room.st==='end'?'podium':room.mode;T3.set(k);
if(k==='globe')T3.orbit(P.length);if(k==='podium')T3.podium(rk().slice(0,3).map(p=>({n:p.name,v:String(mv(p)),a:p.av})));
if(room.st==='play'){if(room.mode==='race')T3.cars(rk().map(p=>({id:p.id,pos:p.pos,a:p.av})),uid);const m=me();if(room.mode==='surv'&&m)T3.hearts(m.lives)}}
function renderSide(){const s=E('side');if(s&&room&&room.st==='play'){s.innerHTML=sideH();sync3()}}

function lobbyH(){const md=MD[room.mode];return `<div class="wrap"><div class="top"><b>${md.e} ${md.n}</b><button class="btn g" onclick="leave()">Rời phòng</button></div>
<div class="card"><p class="c mu" style="margin:0">Mã phòng, các bạn mở trang này và nhập mã để vào</p><div class="code">${esc(code)}</div><p class="c mu">${md.d}</p>${/^https?:/.test(location.protocol)?`<p class="c mu sm" style="word-break:break-all">Link mời: ${esc(location.href.split('?')[0].split('#')[0]+'?room='+code)}</p>`:''}</div>
<div class="card"><h4 style="margin-top:0" class="c">Chọn nhân vật · mỗi nhân vật chỉ một người dùng</h4>${pickH()}</div>
